AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Credit Card Tracker - Discord-based expense classification (DynamoDB Backend)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  SecretsEnvironment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    
  DiscordClassificationsChannelId:
    Type: String
    Description: Channel ID for transaction classification
  DiscordSettlementsChannelId:
    Type: String
    Description: Channel ID for monthly settlements
    
  # Plaid Configuration
  PlaidEnv:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, development, production]
    
  # User Configuration
  UserAName:
    Type: String
    Default: Alex
  UserBName:
    Type: String
    Default: Beth
  DiscordUserA:
    Type: String
    Description: Discord Username for User A (e.g. chrisy076)
  DiscordUserB:
    Type: String
    Description: Discord Username for User B (e.g. bethy123)

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        SECRET_ID: !Sub cc-classifier/${SecretsEnvironment}/secrets
        TABLE_NAME: !Ref TransactionsTable
        
        DISCORD_CLASSIFICATIONS_CHANNEL_ID: !Ref DiscordClassificationsChannelId
        DISCORD_SETTLEMENTS_CHANNEL_ID: !Ref DiscordSettlementsChannelId
        
        PLAID_ENV: !Ref PlaidEnv
        
        USER_A_NAME: !Ref UserAName
        USER_B_NAME: !Ref UserBName
        DISCORD_USER_A: !Ref DiscordUserA
        DISCORD_USER_B: !Ref DiscordUserB

Conditions:
  SchedulesEnabled: !Equals [!Ref Environment, prod]

Resources:
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cc-statement-admin-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub cc-statement-${AWS::AccountId}-${Environment}
      UserPoolId: !Ref AdminUserPool

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub https://${AdminDistribution.DomainName}/
      LogoutURLs:
        - !Sub https://${AdminDistribution.DomainName}/
      PreventUserExistenceErrors: ENABLED

  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        Authorizers:
          AdminCognito:
            UserPoolArn: !GetAtt AdminUserPool.Arn

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/admin_api.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cc-classifier/${SecretsEnvironment}/secrets-*
      Events:
        ListStatements:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /api/statements
            Method: GET
            Auth:
              Authorizer: AdminCognito
        GetStatement:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /api/statements/{month}
            Method: GET
            Auth:
              Authorizer: AdminCognito
        SaveStatement:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /api/statements/{month}
            Method: PUT
            Auth:
              Authorizer: AdminCognito
        PublishStatement:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /api/statements/{month}/publish
            Method: POST
            Auth:
              Authorizer: AdminCognito
        UpdateTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref AdminApi
            Path: /api/transactions/{transaction_id}
            Method: PATCH
            Auth:
              Authorizer: AdminCognito

  AdminSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  AdminOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cc-statement-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub cc-statement-${Environment}-api-origin
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Authorization, Content-Type]
        QueryStringsConfig:
          QueryStringBehavior: all

  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: admin-site
            DomainName: !GetAtt AdminSiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt AdminOriginAccessControl.Id
          - Id: admin-api
            DomainName: !Sub ${AdminApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: /Prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: admin-site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: admin-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref AdminApiOriginRequestPolicy

  AdminSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AdminSiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DailyScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/daily_scan.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cc-classifier/${SecretsEnvironment}/secrets-*
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Description: Daily transaction scan
            # State preserves the condition through SAM's transform.
            State: !If [SchedulesEnabled, ENABLED, DISABLED]
        MonthlySettlement:
          Type: Schedule
          Properties:
            Schedule: cron(0 10 1 * ? *)
            Description: Monthly settlement calculation
            # State preserves the condition through SAM's transform.
            State: !If [SchedulesEnabled, ENABLED, DISABLED]
            Input: '{"resources": ["MonthlySettlement"]}'

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambdas/webhook.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cc-classifier/${SecretsEnvironment}/secrets-*
      Events:
        DiscordWebhook:
          Type: Api
          Properties:
            Path: /discord
            Method: POST

Outputs:
  AdminSiteUrl:
    Value: !Sub https://${AdminDistribution.DomainName}/
  AdminSiteBucketName:
    Value: !Ref AdminSiteBucket
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminUserPoolClientId:
    Value: !Ref AdminUserPoolClient
  AdminCognitoDomain:
    Value: !Sub ${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  InteractionsEndpointUrl:
    Description: URL to paste into Discord Developer Portal -> General Information -> Interactions Endpoint URL
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/discord
  DynamoDBTableName:
    Description: Name of the DynamoDB table
    Value: !Ref TransactionsTable
